[package]
name = "plugin-media-gen-engine"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-image-engine"
description = "Reusable stable-diffusion.cpp engine: install/update sd-server.exe variants, image model bundles, VRAM preflight, generate/edit via HTTP (SSOT for King Orch and other hosts)"
license = "MIT"
readme = "docs/README.md"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Системные метрики команд (GPU-имя, свободное место) — тонкие фасадные хелперы.
nvml-wrapper = "0.10.0"
sysinfo = "0.30.0"
tokio = { workspace = true }
# Скачивание бандлов/LoRA — ядро downloader-core (как в ядре media-gen-core);
# plugin-downloader (tauri-фасад) сюда больше не тянется.
downloader-core = { path = "../plugin-downloader/core" }

# Чистое ядро (ССОТ, без tauri, Шаг 4f PRP 261115): sd-server-процесс, каталог
# бандлов, VRAM-preflight, generate/edit живут здесь; Tauri-плагин — фасад
# (команды + события). GPUI-хосты берут ядро напрямую.
media-gen-core = { path = "core" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lib]
name = "plugin_media_gen_engine"
path = "src/lib.rs"
