[package]
name = "log-collector-core"
version = "0.1.0"
edition = "2021"
description = "Pure domain core of plugin-log-collector: unified log::Log, exe-adjacent log file, dev mirror test/last_logs, flight recorder and Aptabase reporting. No Tauri, no AppHandle - so a GPUI/native host can depend on it without dragging Tauri into the binary."
license = "MIT"

[dependencies]
log = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lib]
name = "log_collector_core"
path = "src/lib.rs"
