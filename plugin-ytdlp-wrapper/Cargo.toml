[package]
name = "plugin-ytdlp-wrapper"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-ytdlp"
description = "Reusable yt-dlp engine: install/update yt-dlp binary, download YouTube videos with progress tracking"
license = "MIT"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Кукисы браузеров для yt-dlp (anti-bot): та же версия, что в dpi_gui — проверена на этой машине.
rookie = "0.5.6"

# Чистое ядро (SSOT, без tauri): установка/скачивание/субтитры живут здесь;
# Tauri-плагин — фасад (мост data_dir + события ytdlp:download-* + команды).
ytdlp-core = { path = "core" }

[lib]
name = "plugin_ytdlp_wrapper"
path = "src/lib.rs"
