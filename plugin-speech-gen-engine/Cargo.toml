[package]
name = "plugin-speech-gen-engine"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-speech"
description = "Reusable CrispASR TTS/STT engine (prebuilt subprocess + HTTP/WS) with settings panels for Tauri apps"
license = "MIT"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Чистое ядро (ССОТ, без tauri, Шаг 4e PRP 261115): движки TTS/STT/диалога,
# аудио, скачивание движков живут здесь; Tauri-плагин — фасад (мост config_dir,
# событий SpeechEvent → stt-*/tts-caps/dialog-status + команды).
speech-core = { path = "core" }

[lib]
name = "plugin_speech_gen_engine"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
