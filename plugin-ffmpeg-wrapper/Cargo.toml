[package]
name = "plugin-ffmpeg-wrapper"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-ffmpeg"
description = "Reusable FFmpeg engine: auto-download official build into a host-provided dir, run ffmpeg/ffprobe as subprocess (no shell)"
license = "MIT"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# Чистое ядро (SSOT, без tauri): установка/запуск/probe/pipe живёт здесь;
# Tauri-плагин — фасад (re-export engine + команды). zip/скачивание — в ядре.
ffmpeg-core = { path = "core" }

[lib]
name = "plugin_ffmpeg_wrapper"
path = "src/lib.rs"
