[package]
name = "plugin-about-updates"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-about-updates"
description = "Reusable About/Updates panel (GitHub Releases history + rollback + check/install) — thin Tauri facade over about-updates-core"
license = "MIT"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
# Ядро обновлений (без Tauri) — ССОТ: история/проверка/установка/отчёт/бэкап.
# GPUI-хосты берут его напрямую, минуя tauri-фасад.
about-updates-core = { path = "core" }

[lib]
name = "plugin_about_updates"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tokio = { workspace = true }
