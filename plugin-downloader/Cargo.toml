[package]
name = "plugin-downloader"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-downloader"
description = "Unified file download engine (reqwest multi-chunk + curl + process fallbacks) with progress/speed/ETA events and web-component progress UI — thin Tauri facade over downloader-core"
license = "MIT"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
# Ядро движка (без Tauri) — ССОТ скачивания, его берут и GPUI-хосты.
downloader-core = { path = "core" }

[lib]
name = "plugin_downloader"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
