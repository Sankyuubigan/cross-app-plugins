[package]
name = "downloader-core"
version = "0.1.0"
edition = "2021"
description = "Unified file download engine (reqwest multi-chunk + curl + process fallbacks) with progress/speed/ETA hooks — pure core, no Tauri"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
futures-util = "0.3"
curl = "0.4"

[lib]
name = "downloader_core"
path = "src/lib.rs"
